name: Engine CI
on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04","ubuntu-24.04-arm","macos-15"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and build tools
        run: python -m pip install pytest ninja
      - name: Configure release build
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDUCKDB_EXPLICIT_VERSION=v2.0.1 -DBUILD_UNITTESTS=ON \
            "-DDUCKDB_EXTENSION_CONFIGS=$PWD/.github/config/bundled_extensions.cmake"
      - name: Build engine and tests
        run: cmake --build build/release --parallel 3
      - name: Hardcharger Engine regression cases
        run: build/release/test/run --test-list .github/workflows/engine-regressions.list
      - name: Upstream pull request smoke suite
        if: github.event_name == 'pull_request'
        run: make smoke SMOKE_RUNNER=build/release/test/run
      - name: Full DuckDB test suite including slow cases
        if: github.event_name != 'pull_request'
        run: make allunit
      - name: CLI and SQL logic runner tests
        run: |
          python -m pytest -q tools/shell/tests --shell-binary build/release/duckdb
          python -m pytest -q tools/sqllogic/tests --unittest-binary build/release/test/unittest
      - name: Package and verify CLI and C SDK
        run: python scripts/package_engine.py build/release dist
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.runner }}
          path: dist/*.tar.gz
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish tested artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          merge-multiple: true
          path: dist
      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENGINE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for platform in linux-amd64 linux-arm64 macos-arm64; do
            for kind in cli shared-libs; do
              test -s "hardcharger-engine-$kind-$platform.tar.gz"
            done
          done
          sha256sum ./*.tar.gz > SHA256SUMS
          gh release create "$ENGINE_TAG" --verify-tag --title "Hardcharger Engine $ENGINE_TAG" \
            --notes "CLI and C SDK builds for Linux x86-64, Linux ARM64, and Apple Silicon. See the [engine differences](https://github.com/$GH_REPO/blob/$ENGINE_TAG/docs/optimizations.md) for the upstream baseline and measured results." \
            ./*.tar.gz SHA256SUMS
