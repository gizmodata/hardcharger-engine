name: Engine CI
on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Optional release tag to create on this commit after all checks pass (main only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04","ubuntu-24.04-arm","macos-15"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and build tools
        run: python -m pip install pytest ninja
      - name: Configure release build
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDUCKDB_EXPLICIT_VERSION=v2.0.1 -DBUILD_UNITTESTS=ON \
            "-DDUCKDB_EXTENSION_CONFIGS=$PWD/.github/config/bundled_extensions.cmake"
      - name: Build engine and tests
        run: cmake --build build/release --parallel 3
      - name: Hardcharger Engine regression cases
        run: build/release/test/run --test-list .github/workflows/engine-regressions.list
      - name: Upstream pull request smoke suite
        if: github.event_name == 'pull_request'
        run: make smoke SMOKE_RUNNER=build/release/test/run
      - name: Full DuckDB test suite including slow cases
        if: github.event_name != 'pull_request'
        run: make allunit
      - name: CLI and SQL logic runner tests
        run: |
          python -m pytest -q tools/shell/tests --shell-binary build/release/duckdb
          python -m pytest -q tools/sqllogic/tests --unittest-binary build/release/test/unittest
      - name: Package and verify CLI and C SDK
        run: python scripts/package_engine.py build/release dist
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.runner }}
          path: dist/*.tar.gz
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish tested artifacts
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_tag != '')
    needs: build
    concurrency:
      group: publish-engine-${{ inputs.publish_tag || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check release recovery
        run: python3 scripts/test_publish_engine.py
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENGINE_TAG: ${{ inputs.publish_tag || github.ref_name }}
        run: python3 scripts/publish_engine.py dist
